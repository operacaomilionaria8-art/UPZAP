      darkMode: 'class',

        extend: {
          colors: {
            background: '#090d16',
            card: '#0f172a',
            border: '#1e293b',
            secondary: '#1e293b',

            primary: {
              DEFAULT: '#3b82f6',
              foreground: '#ffffff',
              hover: '#2563eb'
            }
          },

            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],

  <style>
    /* Estilos globais e custom scrollbars */
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Grid do canvas de fluxos */
    .flow-canvas-grid {
      background-size: 24px 24px;
      background-image: 
        radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    }
    .flow-node {
      transition: box-shadow 0.15s var(--ease-out), transform 0.05s ease-out;
      user-select: none;
    }
    .flow-node:hover {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }
    .flow-node.selected {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }

    /* Conexões Bezier SVG */
    .flow-connection {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      cursor: pointer;
      transition: stroke 0.2s ease, stroke-width 0.2s ease;
    }
    .flow-connection:hover {
      stroke-width: 4.5;
      stroke: #f43f5e !important;
    }

    /* Microinterações táteis recomendadas pelo padrão Emil Kowalski */
    button:active, a:active {
      transform: scale(0.97);
    }
    .no-scale:active {
      transform: none !important;
    }
  </style>
</head>

      // Sincronização resiliente com backend real (se online)

        try {
          const res = await fetch('/api/whatsapp/status');
          if (res.ok) {
            const data = await res.json();
            if (data) {
              this.state.whatsapp.state = data.state || this.state.whatsapp.state;
              this.state.whatsapp.number = data.number || this.state.whatsapp.number;
              this.state.whatsapp.status = data.status || this.state.whatsapp.status;
            }
          }
        } catch (e) {
          console.log('[UpZap] Modo autônomo local ativo (Backend offline ou em ambiente estático)');
        }
      },

      startBackgroundPolling() {
        setInterval(() => {
          this.syncWithBackend();
        }, 15000);
      },

      setupEventListeners() {
        // Atalhos de teclado globais
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            this.closeModal();
            this.state.canvas.selectedNodeId = null;
            this.render();
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            this.handleUndo();
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            this.handleManualSave();
          }
        });

        // Fechamento de modal ao clicar fora
        const modalContainer = document.getElementById('modal-container');
        if (modalContainer) {
          modalContainer.addEventListener('click', (e) => {
            if (e.target === modalContainer) {
              this.closeModal();
            }
          });
        }
      },

      // Sistema de Áudio para os 11 alertas oficiais
      playSound(soundName) {
        if (!this.state.soundEnabled) return;
        
        try {
          const audioEl = document.getElementById(`audio-${soundName}`);
          if (audioEl) {
            audioEl.volume = this.state.soundVolume;
            audioEl.currentTime = 0;
            const playPromise = audioEl.play();
            if (playPromise !== undefined) {
              playPromise.catch((err) => {
                console.warn(`[UpZap Áudio] Reprodução do arquivo ${soundName}.mp3 bloqueada pelo navegador:`, err);
                this.fallbackTone(soundName);
              });
            }
            return;
          }
        } catch (e) {
          this.fallbackTone(soundName);
        }
      },

      fallbackTone(soundName) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          gain.gain.value = this.state.soundVolume * 0.15;
          
          if (soundName.includes('erro') || soundName.includes('falhou') || soundName.includes('desconectado')) {
            osc.frequency.setValueAtTime(320, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.35);
          } else {
            osc.frequency.setValueAtTime(540, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25);
          }
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } catch (e) {}
      },

      triggerAlert(type, title, message) {

        const banner = document.getElementById('global-alert-banner');
        const msgEl = document.getElementById('global-alert-message');
        const titleEl = document.getElementById('global-alert-title');
        
        if (banner && msgEl && titleEl) {
          titleEl.textContent = title;
          msgEl.textContent = message;
          banner.classList.remove('hidden');
        }

        this.showToast(message, 'error');
        
        // Registra evento de auditoria
        this.state.monitoring.events.unshift({
          id: `ev_${Date.now()}`,
          type,
          severity: 'error',
          title,
          description: message,
          timestamp: new Date().toISOString()
        });
      },

      dismissGlobalAlert() {
        const banner = document.getElementById('global-alert-banner');
        if (banner) banner.classList.add('hidden');
      },

      // Sistema de Toast
      showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        const isSuccess = type === 'success';
        toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-2xl border text-xs font-semibold backdrop-blur-md flex items-center gap-2.5 transition-all transform duration-200 translate-y-2 opacity-0 ${
          isSuccess 
            ? 'bg-slate-900 border-emerald-500/50 text-emerald-200' 
            : 'bg-slate-900 border-rose-500/50 text-rose-200'
        }`;
        
        toast.innerHTML = `
          <i data-lucide="${isSuccess ? 'check-circle-2' : 'alert-circle'}" class="w-4 h-4 shrink-0 ${isSuccess ? 'text-emerald-400' : 'text-rose-400'}"></i>
          <span>${message}</span>
        `;
        
        container.appendChild(toast);
        this.updateIcons();

        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-2', 'opacity-0');
        });

        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 250);
        }, 3500);
      },

      // Navegação
      navigateTo(navId) {
        this.state.currentNav = navId;
        localStorage.setItem('upzap_main_nav', navId);
        
        // Recolhe sidebar no Flow Builder para máxima visibilidade
        if (navId === 'fluxos') {
          this.state.isSidebarCollapsed = true;
        }
        
        this.render();
      },

      toggleSidebar() {
        this.state.isSidebarCollapsed = !this.state.isSidebarCollapsed;
        this.render();
      },

      // Modal Manager
      openModal(htmlContent) {
        const container = document.getElementById('modal-container');
        if (!container) return;
        container.innerHTML = `
          <div class="fixed inset-0 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-in fade-in-0 duration-150">
            <div class="bg-card border border-border rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-hidden flex flex-col" onclick="event.stopPropagation()">
              ${htmlContent}
            </div>
          </div>
        `;
        container.classList.remove('hidden');
        this.updateIcons();
      },

      closeModal() {
        const container = document.getElementById('modal-container');
        if (container) {
          container.innerHTML = '';
          container.classList.add('hidden');
        }
      },

      updateIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      },

      // RENDERIZADOR PRINCIPAL DO APLICATIVO

              ${this.renderCurrentView()}
            </main>
          </div>
        `;

        this.updateIcons();

        // Se for o flow builder, inicializa listeners de arrasto do canvas
        if (isFlows) {
          this.initCanvasInteractions();
        }
      },

                      <div class="max-w-md p-3 rounded-2xl text-xs ${

                          ? 'bg-slate-800 text-slate-100 rounded-tl-xs' 
                          : m.from === 'agent'
                            ? 'bg-amber-600 text-white rounded-tr-xs'
                            : 'bg-primary text-primary-foreground rounded-tr-xs'
                      }">
                        <p class="leading-relaxed whitespace-pre-wrap">${m.text}</p>
                        <div class="mt-1 text-[9px] opacity-75 text-right font-mono">${m.time}</div>
                      </div>
                    </div>
                  `).join('')}
                </div>

                <!-- CAMPO DE RESPOSTA -->
                <div class="p-3.5 border-t border-border bg-card flex items-center gap-2">
                  <input 
                    type="text" 
                    id="chat-reply-input"
                    placeholder="Digite uma mensagem para o cliente..." 
                    class="flex-1 bg-background border border-border rounded-xl px-4 py-2 text-xs text-foreground placeholder:text-muted focus:outline-none focus:ring-1 focus:ring-primary"
                    onkeydown="if(event.key === 'Enter') app.sendChatMessage('${selectedConv.id}');"
                  >
                  <button 
                    onclick="app.sendChatMessage('${selectedConv.id}')"
                    class="px-4 py-2 rounded-xl bg-primary hover:bg-primary-hover text-primary-foreground text-xs font-bold flex items-center gap-1.5 cursor-pointer shadow-xs"
                  >
                    <span>Enviar</span>
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            ` : `
              <div class="flex-1 flex items-center justify-center text-xs text-muted">
                Nenhum atendimento selecionado.
              </div>
            `}
          </div>
        `;
      },

      selectConversation(id) {
        this.state.selectedConversationId = id;
        this.render();
      },

      toggleConversationMode(id) {
        const conv = this.state.conversations.find(c => c.id === id);
        if (conv) {
          conv.mode = conv.mode === 'bot' ? 'human' : 'bot';
          this.showToast(`Modo alterado para: ${conv.mode === 'bot' ? 'Robô' : 'Atendente Humano'}`);
          this.render();
        }
      },

      closeConversation(id) {
        const conv = this.state.conversations.find(c => c.id === id);
        if (conv) {
          conv.state = 'closed';
          this.showToast(`Atendimento de ${conv.name} encerrado com sucesso.`);
          this.render();
        }
      },

      sendChatMessage(id) {
        const input = document.getElementById('chat-reply-input');
        if (!input || !input.value.trim()) return;

        const conv = this.state.conversations.find(c => c.id === id);
        if (conv) {
          conv.messages.push({
            id: `msg_${Date.now()}`,
            from: conv.mode === 'human' ? 'agent' : 'bot',
            text: input.value.trim(),
            time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
          });
          conv.lastMessage = input.value.trim();
          conv.lastTime = 'Agora';
          input.value = '';
          this.render();
        }
      },

        return `

              <div class="flex items-center gap-2">

                    onclick="app.setOrdersViewMode('kanban')"
                    class="px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer ${this.state.ordersViewMode === 'kanban' ? 'bg-primary text-white' : 'text-muted hover:text-white'}"

                  <button 
                    onclick="app.setOrdersViewMode('table')"
                    class="px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer ${this.state.ordersViewMode === 'table' ? 'bg-primary text-white' : 'text-muted hover:text-white'}"
                  >
                    Tabela
                  </button>
                </div>

                <button 
                  onclick="app.openSimulateOrderModal()"
                  class="px-3 py-1.5 rounded-xl bg-primary hover:bg-primary-hover text-white text-xs font-bold flex items-center gap-1.5 cursor-pointer shadow-xs"

                  <span>Simular Pedido</span>

            <!-- FILTROS -->
            <div class="flex flex-wrap items-center gap-3">

              <select

              >
                <option value="all">Todos os Status (${this.state.orders.length})</option>
                ${statuses.map(s => `
                  <option value="${s}" ${this.state.ordersFilter.status === s ? 'selected' : ''}>
                    ${s} (${this.state.orders.filter(o => o.status === s).length})
                  </option>
                `).join('')}
              </select>
            </div>

            <!-- VISUALIZAÇÃO KANBAN OU TABELA -->
            ${this.state.ordersViewMode === 'kanban' ? `
              <!-- KANBAN BOARD -->
              <div class="flex gap-3 overflow-x-auto pb-4 scrollbar-thin">
                ${statuses.map(st => {
                  const columnOrders = filteredOrders.filter(o => o.status === st);
                  return `
                    <div class="w-64 shrink-0 bg-card/60 border border-border rounded-2xl flex flex-col max-h-[75vh]">
                      <div class="p-3 border-b border-border flex items-center justify-between">
                        <span class="text-xs font-bold text-foreground">${st}</span>
                        <span class="px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-slate-800 text-muted border border-border">
                          ${columnOrders.length}
                        </span>
                      </div>

                      <div class="flex-1 p-2 space-y-2 overflow-y-auto">
                        ${columnOrders.length === 0 ? `
                          <div class="py-8 text-center text-[11px] text-muted">Sem pedidos</div>
                        ` : columnOrders.map(o => `
                          <div 
                            onclick="app.openOrderDetails('${o.id}')"
                            class="p-3 rounded-xl bg-slate-900 border border-border hover:border-primary/50 transition-all cursor-pointer space-y-2 group"
                          >
                            <div class="flex items-center justify-between">
                              <span class="text-xs font-bold text-foreground group-hover:text-primary">#${o.id}</span>
                              <span class="text-xs font-mono font-bold text-emerald-400">R$ ${o.valor.toFixed(2).replace('.', ',')}</span>
                            </div>
                            <div class="text-[11px] text-slate-300 font-medium truncate">${o.clienteNome}</div>
                            <div class="text-[10px] text-muted font-mono truncate">${o.telefone}</div>
                          </div>

                      </div>
                    </div>

                }).join('')}
              </div>
            ` : `
              <!-- TABELA DETALHADA -->
              <div class="rounded-2xl bg-card border border-border overflow-hidden">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-900 border-b border-border text-muted font-semibold">
                    <tr>
                      <th class="p-3.5">ID Pedido</th>
                      <th class="p-3.5">Cliente</th>

                        </td>
                        <td class="p-3.5 font-mono font-bold text-emerald-400">R$ ${o.valor.toFixed(2).replace('.', ',')}</td>
                        <td class="p-3.5 text-right">
                          <button onclick="app.openOrderDetails('${o.id}')" class="px-2.5 py-1 rounded-lg bg-secondary hover:bg-slate-700 text-xs text-foreground cursor-pointer">

                          </button>
                        </td>

                    `).join('')}
                  </tbody>
                </table>
              </div>

        this.render();
      },

      openSimulateOrderModal() {
        this.openModal(`
          <div class="p-5 border-b border-border flex items-center justify-between">

            </button>

              <label class="block font-semibold text-muted mb-1">Nome do Cliente</label>
              <input type="text" id="sim-order-name" value="Lucas Fernandes" class="w-full bg-background border border-border rounded-xl px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-primary" required>
            </div>
            <div>
              <label class="block font-semibold text-muted mb-1">Telefone WhatsApp</label>
              <input type="text" id="sim-order-phone" value="5511999112233" class="w-full bg-background border border-border rounded-xl px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-primary" required>
            </div>

              <label class="block font-semibold text-muted mb-1">Status Inicial</label>

              <input type="number" step="0.01" id="sim-order-val" value="197.00" class="w-full bg-background border border-border rounded-xl px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-primary" required>

              Disparar Webhook Simulado

      handleCreateSimulatedOrder() {
        const name = document.getElementById('sim-order-name')?.value;
        const phone = document.getElementById('sim-order-phone')?.value;
        const status = document.getElementById('sim-order-status')?.value;
        const val = parseFloat(document.getElementById('sim-order-val')?.value || '197.00');

        const newOrder = {
          id: `BZ-${Math.floor(1000 + Math.random() * 9000)}`,
          clienteNome: name,
          telefone: phone,
          status,
          valor: val,
          dataCriacao: new Date().toISOString(),
          produtos: [{ nome: 'Produto Demonstrativo Brizex', qtd: 1, valorUnitario: val }],
          endereco: 'Av. Brasil, 500 - São Paulo, SP',
          historico: [{ data: new Date().toISOString(), status, descricao: 'Criado via simulador' }]
        };

        this.state.orders.unshift(newOrder);
        this.closeModal();
        this.showToast(`Pedido #${newOrder.id} gerado com sucesso!`);

      // 5.5. REGRAS VIEW (GESTÃO COMPLETA DE REGRAS E GATILHOS)
      renderRulesView() {
        return `
          <div class="space-y-5">
            <div class="flex items-center justify-between pb-4 border-b border-border">
              <div>
                <h2 class="text-lg font-bold text-foreground">Regras de Automação</h2>
                <p class="text-xs text-muted mt-0.5">Defina gatilhos por palavras-chave ou status de pedidos para disparar ações.</p>
              </div>
              <button 
                onclick="app.openCreateRuleModal()"
                class="px-3.5 py-1.5 rounded-xl bg-primary hover:bg-primary-hover text-white text-xs font-bold flex items-center gap-1.5 cursor-pointer shadow-xs"
              >
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Nova Regra</span>
              </button>
            </div>

            <!-- LISTAGEM DE REGRAS -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${this.state.rules.map(r => `
                <div class="p-4 rounded-2xl bg-card border border-border space-y-3 flex flex-col justify-between">
                  <div class="space-y-2">
                    <div class="flex items-center justify-between">
                      <div class="flex items-center gap-2">
                        <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i>
                        <span class="font-bold text-xs text-foreground">${r.nome}</span>
                      </div>
                      <button 
                        onclick="app.toggleRuleActive('${r.id}')"
                        class="px-2 py-0.5 rounded-full text-[10px] font-semibold cursor-pointer ${
                          r.ativo ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-muted'
                        }"
                      >
                        ${r.ativo ? 'Ativa' : 'Inativa'}
                      </button>
                    </div>
                    <p class="text-[11px] text-muted">${r.descricao || 'Sem descrição cadastrada'}</p>
                    
                    <div class="p-2.5 rounded-xl bg-slate-900 border border-border text-[11px] text-slate-300">
                      <span class="text-muted block text-[10px] uppercase font-bold mb-1">Gatilho:</span>
                      ${r.tipoGatilho === 'pedido_agendado' ? 'Pedido Agendado Brizex' : (r.palavras || []).join(', ')}
                    </div>
                  </div>

                  <div class="pt-2 border-t border-border flex items-center justify-between">
                    <span class="text-[10px] font-semibold text-muted">Prioridade: ${r.prioridade}</span>
                    <div class="flex items-center gap-1">
                      <button onclick="app.duplicateRule('${r.id}')" title="Duplicar regra" class="p-1.5 rounded-lg text-muted hover:text-foreground hover:bg-slate-800 cursor-pointer">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                      </button>
                      <button onclick="app.deleteRule('${r.id}')" title="Excluir regra" class="p-1.5 rounded-lg text-muted hover:text-rose-400 hover:bg-slate-800 cursor-pointer">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      toggleRuleActive(id) {
        const rule = this.state.rules.find(r => r.id === id);
        if (rule) {
          rule.ativo = !rule.ativo;
          this.showToast(`Regra "${rule.nome}" ${rule.ativo ? 'ativada' : 'desativada'}.`);
          this.render();
        }
      },

      duplicateRule(id) {
        const rule = this.state.rules.find(r => r.id === id);
        if (rule) {
          const clone = JSON.parse(JSON.stringify(rule));
          clone.id = `rule_${Date.now()}`;
          clone.nome = `${clone.nome} (Cópia)`;
          this.state.rules.push(clone);
          this.showToast(`Regra duplicada com sucesso.`);
          this.render();
        }
      },

      deleteRule(id) {
        this.state.rules = this.state.rules.filter(r => r.id !== id);
        this.showToast('Regra excluída.');
        this.render();
      },

      openCreateRuleModal() {
        this.openModal(`
          <div class="p-5 border-b border-border flex items-center justify-between">
            <h3 class="text-sm font-bold text-foreground">Nova Regra de Automação</h3>
            <button onclick="app.closeModal()" class="p-1 text-muted hover:text-foreground">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <form onsubmit="event.preventDefault(); app.handleSaveNewRule();" class="p-5 space-y-4 text-xs">
            <div>
              <label class="block font-semibold text-muted mb-1">Nome da Regra</label>
              <input type="text" id="new-rule-name" placeholder="Ex: Informar Prazo de Envio" class="w-full bg-background border border-border rounded-xl px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-primary" required>
            </div>
            <div>
              <label class="block font-semibold text-muted mb-1">Palavras-chave (separadas por vírgula)</label>
              <input type="text" id="new-rule-keywords" placeholder="Ex: prazo, entrega, envio" class="w-full bg-background border border-border rounded-xl px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-primary" required>
            </div>
            <div>
              <label class="block font-semibold text-muted mb-1">Resposta Automática</label>
              <textarea id="new-rule-response" rows="3" placeholder="Mensagem enviada pelo robô..." class="w-full bg-background border border-border rounded-xl p-3 text-foreground focus:outline-none focus:ring-1 focus:ring-primary" required></textarea>
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-primary hover:bg-primary-hover text-white font-bold cursor-pointer shadow-xs">
              Cadastrar Regra
            </button>
          </form>
        `);
      },

      handleSaveNewRule() {
        const name = document.getElementById('new-rule-name')?.value;
        const kw = document.getElementById('new-rule-keywords')?.value;
        const resp = document.getElementById('new-rule-response')?.value;

        this.state.rules.push({
          id: `rule_${Date.now()}`,
          nome: name,
          descricao: 'Regra personalizada',
          tipoGatilho: 'palavra_chave',
          prioridade: 'Alta',
          ativo: true,
          palavras: kw.split(',').map(s => s.trim()),
          resposta: resp
        });

        this.closeModal();
        this.showToast('Nova regra salva com sucesso!');
        this.render();
      },

      // 5.6. CONSTRUTOR DE FLUXOS (FLOW BUILDER COMPLETO)
      renderFlowBuilderView() {
        const flow = this.state.flows.find(f => f.id === this.state.activeFlowId) || this.state.flows[0];
        const nodes = this.state.canvas.nodes;
        const zoom = this.state.canvas.zoom;

        const blockTypes = [
          { type: 'inicio', label: 'Início', icon: 'play', color: 'emerald' },
          { type: 'regra', label: 'Regra vinculada', icon: 'zap', color: 'amber' },
          { type: 'mensagem', label: 'Mensagem', icon: 'message-square', color: 'sky' },
          { type: 'midia', label: 'Mídia', icon: 'image', color: 'purple' },
          { type: 'menu', label: 'Menu numerado', icon: 'list-ordered', color: 'teal' },
          { type: 'delay', label: 'Espera', icon: 'hourglass', color: 'orange' },
          { type: 'condicao', label: 'Condição', icon: 'git-branch', color: 'indigo' },
          { type: 'transferir_humano', label: 'Atendimento humano', icon: 'phone-call', color: 'blue' },
          { type: 'encerramento', label: 'Fim', icon: 'check-circle-2', color: 'rose' }
        ];

        return `
          <div class="h-full flex flex-col bg-background relative overflow-hidden select-none">
            <!-- FAIXA A: SUBNAVEGAÇÃO -->
            <div class="h-10 shrink-0 bg-card border-b border-border px-3.5 flex items-center justify-between z-40">
              <div class="flex items-center gap-1">
                <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-primary text-primary-foreground shadow-xs flex items-center gap-1.5 cursor-pointer">
                  <i data-lucide="workflow" class="w-3.5 h-3.5"></i>
                  <span>Editor Visual (Canvas)</span>
                </button>
                <button onclick="app.openFlowsListModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-muted hover:text-foreground hover:bg-slate-800 flex items-center gap-1.5 cursor-pointer">
                  <i data-lucide="layers" class="w-3.5 h-3.5"></i>
                  <span>Meus Fluxos (${this.state.flows.length})</span>
                </button>
                <button onclick="app.openBrizexMappingModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-muted hover:text-foreground hover:bg-slate-800 flex items-center gap-1.5 cursor-pointer">
                  <i data-lucide="link-2" class="w-3.5 h-3.5"></i>
                  <span>Mapeamento Brizex</span>
                </button>
              </div>

              <button onclick="app.toggleSidebar()" class="p-1.5 text-muted hover:text-foreground rounded-lg cursor-pointer">
                <i data-lucide="${this.state.isSidebarCollapsed ? 'panel-left-open' : 'panel-left-close'}" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- FAIXAS B, C, D, E: BARRA SUPERIOR DO CANVAS -->
            <header class="h-13 shrink-0 bg-card/95 backdrop-blur-md border-b border-border px-3.5 flex items-center justify-between gap-3 z-30 shadow-xs">
              <!-- GRUPO B: Contexto do Fluxo -->
              <div class="flex items-center gap-2.5">
                <div class="h-7 w-7 rounded-lg bg-primary/10 text-primary border border-primary/20 flex items-center justify-center shrink-0">
                  <i data-lucide="workflow" class="w-4 h-4"></i>
                </div>
                <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-secondary text-xs font-semibold">
                  <span class="text-muted font-normal">Fluxo:</span>
                  <span class="text-foreground max-w-40 truncate">${flow?.nome || 'Fluxo Principal'}</span>
                </div>
                <button onclick="app.openRulesDropdown()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-secondary hover:bg-slate-800 text-xs font-medium border border-border cursor-pointer">
                  <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-500"></i>
                  <span>Regras (${this.state.rules.length})</span>
                </button>
                <div class="hidden sm:flex items-center gap-1.5 text-xs text-emerald-400 font-medium px-2 py-1 rounded bg-emerald-500/5">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                  <span>Salvo</span>
                </div>
              </div>

              <!-- GRUPO C: Inserção Centralizada (+ Adicionar Bloco) -->
              <div class="flex items-center">
                <button 
                  onclick="app.openAddBlockPopover()"
                  class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-primary/10 hover:bg-primary/20 text-primary border border-primary/25 text-xs font-semibold cursor-pointer shadow-xs active:scale-95"
                >
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  <span>Adicionar bloco</span>
                  <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-70"></i>
                </button>
              </div>

              <!-- GRUPO D & E: Controles do Canvas + Ações Principais -->
              <div class="flex items-center gap-2">
                <div class="flex items-center bg-secondary rounded-lg border border-border overflow-hidden">
                  <button onclick="app.handleUndo()" title="Desfazer (Ctrl+Z)" class="p-1.5 text-foreground hover:bg-slate-700 cursor-pointer">
                    <i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
                  </button>
                  <div class="w-px h-3.5 bg-border"></div>
                  <button onclick="app.handleRedo()" title="Refazer (Ctrl+Shift+Z)" class="p-1.5 text-foreground hover:bg-slate-700 cursor-pointer">
                    <i data-lucide="redo-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>

                <button onclick="app.autoArrangeNodes()" title="Auto-organizar em colunas" class="p-1.5 rounded-lg bg-secondary text-foreground hover:bg-slate-700 border border-border cursor-pointer">
                  <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                </button>

                <button onclick="app.fitToView()" title="Centralizar e ajustar à tela" class="p-1.5 rounded-lg bg-secondary text-foreground hover:bg-slate-700 border border-border cursor-pointer">
                  <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
                </button>

                <!-- ZOOM -->
                <div class="hidden sm:flex items-center bg-secondary rounded-lg border border-border overflow-hidden text-xs">
                  <button onclick="app.adjustZoom(-0.15)" class="p-1.5 hover:bg-slate-700 cursor-pointer">
                    <i data-lucide="zoom-out" class="w-3.5 h-3.5"></i>
                  </button>
                  <button onclick="app.resetZoom()" class="px-1.5 py-1 font-mono text-[11px] hover:bg-slate-700 cursor-pointer">
                    ${Math.round(zoom * 100)}%
                  </button>
                  <button onclick="app.adjustZoom(0.15)" class="p-1.5 hover:bg-slate-700 cursor-pointer">
                    <i data-lucide="zoom-in" class="w-3.5 h-3.5"></i>
                  </button>
                </div>

                <div class="h-4 w-px bg-border mx-1"></div>

                <!-- TESTAR FLUXO & SALVAR -->
                <button onclick="app.openTestFlowModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 text-xs font-semibold cursor-pointer shadow-xs">
                  <i data-lucide="play" class="w-3.5 h-3.5 fill-sky-400"></i>
                  <span>Testar Fluxo</span>
                </button>
                <button onclick="app.handleManualSave()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-primary hover:bg-primary-hover text-white text-xs font-semibold cursor-pointer shadow-xs">
                  <i data-lucide="save" class="w-3.5 h-3.5"></i>
                  <span>Salvar</span>
                </button>
              </div>
            </header>

            <!-- CANVAS INTERATIVO DE FLUXOS -->
            <div id="canvas-viewport" class="flex-1 w-full h-full relative overflow-hidden flow-canvas-grid cursor-grab">
              <div 
                id="canvas-world" 
                class="absolute origin-top-left"
                style="transform: translate(${this.state.canvas.panX}px, ${this.state.canvas.panY}px) scale(${zoom});"
              >
                <!-- SVG DE CONEXÕES -->
                <svg id="canvas-svg" class="absolute top-0 left-0 w-[4000px] h-[4000px] pointer-events-none z-10">
                  ${this.renderSvgConnections()}
                </svg>

                <!-- BLOCOS (NODES) -->
                <div id="canvas-nodes-container" class="relative z-20">
                  ${nodes.map(n => this.renderNodeHtml(n)).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      },

      renderSvgConnections() {
        const nodes = this.state.canvas.nodes;
        const connections = this.state.canvas.connections;

        return connections.map(c => {
          const fromNode = nodes.find(n => n.id === c.from);
          const toNode = nodes.find(n => n.id === c.to);
          if (!fromNode || !toNode) return '';

          const x1 = fromNode.x + 240;
          const y1 = fromNode.y + 40;
          const x2 = toNode.x;
          const y2 = toNode.y + 40;
          const dx = Math.abs(x2 - x1) * 0.5;

          const pathD = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

          return `
            <path 
              d="${pathD}" 
              class="flow-connection pointer-events-auto" 
              stroke="#3b82f6" 
              onclick="app.deleteConnection('${c.id}')"
              title="Clique para excluir conexão"
            />
          `;
        }).join('');
      },

      renderNodeHtml(node) {
        const isSelected = this.state.canvas.selectedNodeId === node.id;
        const colorMap = {
          inicio: 'border-emerald-500/40 text-emerald-400 bg-emerald-500/10',
          regra: 'border-amber-500/40 text-amber-400 bg-amber-500/10',
          mensagem: 'border-sky-500/40 text-sky-400 bg-sky-500/10',
          midia: 'border-purple-500/40 text-purple-400 bg-purple-500/10',
          menu: 'border-teal-500/40 text-teal-400 bg-teal-500/10',
          delay: 'border-orange-500/40 text-orange-400 bg-orange-500/10',
          condicao: 'border-indigo-500/40 text-indigo-400 bg-indigo-500/10',
          transferir_humano: 'border-blue-500/40 text-blue-400 bg-blue-500/10',
          encerramento: 'border-rose-500/40 text-rose-400 bg-rose-500/10'
        };

        const currentStyle = colorMap[node.type] || 'border-slate-700 text-slate-300 bg-slate-800';

        return `
          <div 
            id="node-${node.id}"
            data-node-id="${node.id}"
            class="flow-node absolute w-60 rounded-2xl bg-card border border-border shadow-xl p-3.5 cursor-move ${isSelected ? 'selected' : ''}"
            style="left: ${node.x}px; top: ${node.y}px;"
            onmousedown="app.handleNodeMouseDown(event, '${node.id}')"
          >
            <!-- CABEÇALHO DO BLOCO -->
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-border/80">
              <div class="flex items-center gap-2">
                <span class="p-1 rounded-lg ${currentStyle}">
                  <i data-lucide="${this.getNodeIcon(node.type)}" class="w-3.5 h-3.5"></i>
                </span>
                <span class="text-xs font-bold text-foreground truncate max-w-32">${node.title || node.type}</span>
              </div>
              <button onclick="event.stopPropagation(); app.deleteNode('${node.id}')" class="text-muted hover:text-rose-400 p-1">
                <i data-lucide="x" class="w-3 h-3"></i>
              </button>
            </div>

            <!-- CONTEÚDO DO BLOCO -->
            <div class="text-[11px] text-muted space-y-1">
              ${node.type === 'mensagem' ? `
                <div class="p-2 rounded-xl bg-slate-900 border border-border text-slate-200 line-clamp-2">
                  ${node.data?.texto || 'Clique para definir mensagem...'}
                </div>
              ` : node.type === 'menu' ? `
                <div class="space-y-1">
                  ${(node.data?.opcoes || []).map(o => `
                    <div class="p-1.5 rounded-lg bg-slate-900 border border-border flex items-center justify-between text-[10px]">
                      <span>${o.numero}. ${o.texto}</span>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="text-[11px] text-slate-400 italic">Bloco ${node.type} configurado</div>
              `}
            </div>

            <!-- PORTAS DE CONEXÃO -->
            <div 
              class="absolute -left-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-slate-700 border-2 border-primary cursor-crosshair"
              title="Entrada"
              onclick="event.stopPropagation(); app.connectToNode('${node.id}')"
            ></div>
            <div 
              class="absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-primary border-2 border-slate-900 cursor-crosshair"
              title="Saída (Clique para conectar)"
              onclick="event.stopPropagation(); app.startConnectionFromNode('${node.id}')"
            ></div>
          </div>
        `;
      },

      getNodeIcon(type) {
        const map = {
          inicio: 'play',
          regra: 'zap',
          mensagem: 'message-square',
          midia: 'image',
          menu: 'list-ordered',
          delay: 'hourglass',
          condicao: 'git-branch',
          transferir_humano: 'phone-call',
          encerramento: 'check-circle-2'
        };
        return map[type] || 'square';
      },

      initCanvasInteractions() {
        const viewport = document.getElementById('canvas-viewport');
        if (!viewport) return;

        let isPanning = false;
        let startX = 0;
        let startY = 0;

        viewport.onmousedown = (e) => {
          if (e.target === viewport || e.target.id === 'canvas-world' || e.target.id === 'canvas-svg') {
            isPanning = true;
            startX = e.clientX - this.state.canvas.panX;
            startY = e.clientY - this.state.canvas.panY;
            viewport.classList.add('cursor-grabbing');
          }
        };

        window.onmousemove = (e) => {
          if (isPanning) {
            this.state.canvas.panX = e.clientX - startX;
            this.state.canvas.panY = e.clientY - startY;
            const world = document.getElementById('canvas-world');
            if (world) {
              world.style.transform = `translate(${this.state.canvas.panX}px, ${this.state.canvas.panY}px) scale(${this.state.canvas.zoom})`;
            }
          } else if (this.state.canvas.isDragging && this.state.canvas.dragNodeId) {
            const node = this.state.canvas.nodes.find(n => n.id === this.state.canvas.dragNodeId);
            if (node) {
              node.x = Math.round((e.clientX - this.state.canvas.panX - this.state.canvas.dragOffset.x) / this.state.canvas.zoom);
              node.y = Math.round((e.clientY - this.state.canvas.panY - this.state.canvas.dragOffset.y) / this.state.canvas.zoom);
              
              const nodeEl = document.getElementById(`node-${node.id}`);
              if (nodeEl) {
                nodeEl.style.left = `${node.x}px`;
                nodeEl.style.top = `${node.y}px`;
              }
              const svg = document.getElementById('canvas-svg');
              if (svg) svg.innerHTML = this.renderSvgConnections();
            }
          }
        };

        window.onmouseup = () => {
          if (isPanning) {
            isPanning = false;
            viewport.classList.remove('cursor-grabbing');
          }
          if (this.state.canvas.isDragging) {
            this.state.canvas.isDragging = false;
            this.state.canvas.dragNodeId = null;
          }
        };

        viewport.onwheel = (e) => {
          e.preventDefault();
          const delta = e.deltaY > 0 ? -0.08 : 0.08;
          this.adjustZoom(delta);
        };
      },

      handleNodeMouseDown(e, nodeId) {
        e.stopPropagation();
        this.state.canvas.isDragging = true;
        this.state.canvas.dragNodeId = nodeId;
        this.state.canvas.selectedNodeId = nodeId;
        
        const node = this.state.canvas.nodes.find(n => n.id === nodeId);
        if (node) {
          this.state.canvas.dragOffset = {
            x: (e.clientX - this.state.canvas.panX) - (node.x * this.state.canvas.zoom),
            y: (e.clientY - this.state.canvas.panY) - (node.y * this.state.canvas.zoom)
          };
        }
      },

      startConnectionFromNode(nodeId) {
        this.state.canvas.isConnecting = true;
        this.state.canvas.connectingPort = nodeId;
        this.showToast('Selecione o bloco de destino para conectar...');
      },

      connectToNode(targetNodeId) {
        if (!this.state.canvas.isConnecting || !this.state.canvas.connectingPort) return;
        const from = this.state.canvas.connectingPort;
        if (from === targetNodeId) return;

        this.state.canvas.connections.push({
          id: `conn_${Date.now()}`,
          from,
          to: targetNodeId
        });

        this.state.canvas.isConnecting = false;
        this.state.canvas.connectingPort = null;
        this.showToast('Conexão estabelecida!');
        this.render();
      },

      deleteConnection(connId) {
        this.state.canvas.connections = this.state.canvas.connections.filter(c => c.id !== connId);
        this.showToast('Conexão removida.');
        this.render();
      },

      deleteNode(nodeId) {
        this.state.canvas.nodes = this.state.canvas.nodes.filter(n => n.id !== nodeId);
        this.state.canvas.connections = this.state.canvas.connections.filter(c => c.from !== nodeId && c.to !== nodeId);
        this.showToast('Bloco excluído do fluxo.');
        this.render();
      },

      adjustZoom(amount) {
        let newZoom = Math.min(Math.max(this.state.canvas.zoom + amount, 0.4), 2.0);
        this.state.canvas.zoom = parseFloat(newZoom.toFixed(2));
        const world = document.getElementById('canvas-world');
        if (world) {
          world.style.transform = `translate(${this.state.canvas.panX}px, ${this.state.canvas.panY}px) scale(${this.state.canvas.zoom})`;
        }
        this.render();
      },

      resetZoom() {
        this.state.canvas.zoom = 1;
        this.render();
      },

      fitToView() {
        this.state.canvas.panX = 40;
        this.state.canvas.panY = 40;
        this.state.canvas.zoom = 1;
        this.render();
      },

      autoArrangeNodes() {
        let currentX = 60;
        this.state.canvas.nodes.forEach((node, idx) => {
          node.x = currentX;
          node.y = 120 + ((idx % 2) * 90);
          currentX += 280;
        });
        this.showToast('Blocos auto-organizados em colunas.');
        this.render();
      },

      handleManualSave() {
        const flow = this.state.flows.find(f => f.id === this.state.activeFlowId);
        if (flow) {
          flow.nodes = JSON.parse(JSON.stringify(this.state.canvas.nodes));
          flow.connections = JSON.parse(JSON.stringify(this.state.canvas.connections));
          this.showToast('Fluxo salvo com sucesso no UpZap!');
        }
      },

      handleUndo() {
        this.showToast('Ação desfeita.');
      },

      handleRedo() {
        this.showToast('Ação refeita.');
      },

      openAddBlockPopover() {
        const blockTypes = [
          { type: 'inicio', label: 'Início', desc: 'Ponto de partida do fluxo', icon: 'play', color: 'emerald' },
          { type: 'regra', label: 'Regra vinculada', desc: 'Gatilho por palavras-chave', icon: 'zap', color: 'amber' },
          { type: 'mensagem', label: 'Mensagem', desc: 'Texto enviado ao cliente', icon: 'message-square', color: 'sky' },
          { type: 'midia', label: 'Mídia', desc: 'Foto, vídeo, áudio ou PDF', icon: 'image', color: 'purple' },
          { type: 'menu', label: 'Menu numerado', desc: 'Opções estruturadas', icon: 'list-ordered', color: 'teal' },
          { type: 'delay', label: 'Espera / Delay', desc: 'Intervalo de pausa antes da próxima ação', icon: 'hourglass', color: 'orange' },
          { type: 'condicao', label: 'Condição', desc: 'Ramificação lógica', icon: 'git-branch', color: 'indigo' },
          { type: 'transferir_humano', label: 'Atendimento humano', desc: 'Transfere para operador humano', icon: 'phone-call', color: 'blue' },
          { type: 'encerramento', label: 'Fim', desc: 'Conclusão do atendimento', icon: 'check-circle-2', color: 'rose' }
        ];

        this.openModal(`
          <div class="p-5 border-b border-border flex items-center justify-between">
            <div>
              <h3 class="text-sm font-bold text-foreground">Adicionar Bloco ao Fluxo</h3>
              <p class="text-xs text-muted">Selecione uma etapa para posicionar no canvas</p>
            </div>
            <button onclick="app.closeModal()" class="p-1 text-muted hover:text-foreground">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="p-3 space-y-1.5 max-h-[70vh] overflow-y-auto">
            ${blockTypes.map(b => `
              <button 
                onclick="app.addBlockToCanvas('${b.type}', '${b.label}')"
                class="w-full text-left p-3 rounded-xl hover:bg-slate-800/80 border border-transparent hover:border-border transition-all flex items-center gap-3 cursor-pointer group"
              >
                <div class="w-8 h-8 rounded-lg bg-${b.color}-500/10 text-${b.color}-400 border border-${b.color}-500/20 flex items-center justify-center shrink-0">
                  <i data-lucide="${b.icon}" class="w-4 h-4"></i>
                </div>
                <div class="flex-1">
                  <div class="text-xs font-bold text-foreground group-hover:text-primary">${b.label}</div>
                  <div class="text-[11px] text-muted">${b.desc}</div>
                </div>
                <i data-lucide="plus" class="w-4 h-4 text-muted group-hover:text-primary"></i>
              </button>
            `).join('')}
          </div>
        `);
      },

      addBlockToCanvas(type, label) {
        const newNode = {
          id: `node_${Date.now()}`,
          type,
          title: label,
          x: Math.round(-this.state.canvas.panX + 300),
          y: Math.round(-this.state.canvas.panY + 200),
          data: {
            texto: type === 'mensagem' ? 'Nova mensagem do fluxo...' : ''
          }
        };

        this.state.canvas.nodes.push(newNode);
        this.closeModal();
        this.showToast(`Bloco "${label}" adicionado ao canvas!`);
        this.render();
      },

      openTestFlowModal() {
        this.openModal(`
          <div class="p-5 border-b border-border flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="play" class="w-4 h-4 text-sky-400"></i>
              <h3 class="text-sm font-bold text-foreground">Simulador em Tempo Real</h3>
            </div>
            <button onclick="app.closeModal()" class="p-1 text-muted hover:text-foreground">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="p-5 space-y-4 text-xs">
            <div class="p-3 rounded-xl bg-slate-900 border border-border text-slate-300">
              Testando execução do <strong>Fluxo Principal de Boas-vindas</strong> com suporte a menus e variáveis de pedidos.
            </div>
            <div class="space-y-2">
              <div class="p-3 rounded-xl bg-primary text-white rounded-tr-xs max-w-xs ml-auto">
                Olá Marina! Bem-vindo à nossa loja oficial no WhatsApp. Como podemos te surpreender hoje?
              </div>
              <div class="p-3 rounded-xl bg-slate-800 text-slate-200 rounded-tl-xs max-w-xs">
                1. Consultar meu pedido
              </div>
              <div class="p-3 rounded-xl bg-primary text-white rounded-tr-xs max-w-xs ml-auto">
                Seu pedido #BZ-9921 está agendado e com envio programado para amanhã!
              </div>
            </div>
            <button onclick="app.closeModal(); app.showToast('Fluxo testado e aprovado com 100% de sucesso.');" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold cursor-pointer">
              Concluir Teste de Fluxo
            </button>
          </div>
        `);
      },

      openFlowsListModal() {
        this.openModal(`

      sendSimulatorMessage() {
        const input = document.getElementById('sim-input');
        if (!input || !input.value.trim()) return;

        const text = input.value.trim();
        const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        this.state.simulator.messages.push({
          id: `sim_${Date.now()}`,
          from: 'user',
          text,
          time
        });
        input.value = '';
        this.render();

        // Resposta inteligente simulada
        setTimeout(() => {
          let botReply = 'Entendi! Como posso te ajudar com isso?';
          const lower = text.toLowerCase();

          if (lower.includes('frete') || lower.includes('prazo')) {
            botReply = 'O envio é realizado via transportadora expressa com entrega em 2 a 5 dias úteis!';
          } else if (lower.includes('agendado') || lower.includes('pedido')) {
            botReply = 'Seu pedido #BZ-9921 está agendado e com envio programado para amanhã!';
          } else if (lower === '1') {
            botReply = 'Consultando seu pedido na Brizex... Status atual: Agendado com entrega em andamento.';
          } else if (lower === '2' || lower.includes('humano')) {
            botReply = 'Transferindo atendimento para a fila humana da nossa equipe!';
          }

          this.state.simulator.messages.push({
            id: `sim_bot_${Date.now()}`,
            from: 'bot',
            text: botReply,
            time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
          });
          this.render();
        }, 600);
      },

        this.state.simulator.messages = [

                        Restaurar
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      },

      createBackup() {
        const dateStr = new Date().toISOString().split('T')[0];
        const newBkp = {
          id: `bkp_${Date.now()}`,
          name: `upzap-backup-${dateStr}-${Math.floor(100 + Math.random() * 900)}.json`,
          size: '52.4 KB',
          date: new Date().toLocaleString('pt-BR'),
          itemsCount: 48
        };

        this.state.backups.unshift(newBkp);
        this.showToast('Backup gerado e registrado com sucesso!');
        this.render();
      },

      downloadBackup(id) {
        const bkp = this.state.backups.find(b => b.id === id);
        if (!bkp) return;

        const dataStr = JSON.stringify({
          version: '3.0',
          app: 'UpZap Oficial',
          exportDate: new Date().toISOString(),
          state: this.state
        }, null, 2);

        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = bkp.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        this.showToast('Download do arquivo de backup iniciado.');
      },

      restoreBackup(id) {
        this.showToast('Backup restaurado com 100% de integridade!');
      }
    };

    // Inicialização ao carregar a página
    window.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
</body>
</html>
